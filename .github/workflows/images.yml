name: images

# For each ZoneMinder channel (newest release, nightly master):
#   prep   resolve the ZoneMinder version and the tags once, so both architectures agree
#   build  on a native runner per architecture (no QEMU): run tests/smoke.sh against the full
#          compose stack, then on master push the images by digest
#   merge  join the per-architecture digests into the multi-arch tags in every repo
# The daily run picks up new ZoneMinder releases (including a new 1.x channel) and nightlies
# without anyone editing this repo. It builds without the layer cache, so Debian security
# updates land within a day. Pushing needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets,
# with a token that can write to both the zoneminder and zoneminderhq organisations.
#
# Images: zoneminder/zoneminder (mirrored to zoneminderhq/zoneminder, the name the old images used)
#         zoneminder/pyzm-serve
# Every tag is also published to GitHub's registry as ghcr.io/zoneminder/zoneminder and
# ghcr.io/zoneminder/pyzm-serve, pushed with the workflow's GITHUB_TOKEN.
#
# Supply chain: each image carries an SBOM and full build provenance as attestations, and the
# merge job signs every multi-arch index with cosign (keyless, through GitHub's OIDC token).
# The amd64 build job scans the smoke-tested images with Grype and reports to the repo's
# Security tab. Scan results never block a push: holding back an image would also hold back
# the Debian security fixes in it. Third-party actions are pinned to a commit.

on:
  push:
    branches: [master]
    paths: ['release/**', 'tests/**', 'docker-compose.yaml', '.github/workflows/images.yml']
  pull_request:
    paths: ['release/**', 'tests/**', 'docker-compose.yaml', '.github/workflows/images.yml']
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      test_push:
        description: Push to the -test repos (e.g. zoneminder/zoneminder-test) from any branch
        type: boolean
        default: false

env:
  # The first repo in each list receives the per-arch pushes; the merge job tags all of them.
  REPOS: zoneminder/zoneminder zoneminderhq/zoneminder ghcr.io/zoneminder/zoneminder
  PYZM_REPOS: zoneminder/pyzm-serve ghcr.io/zoneminder/pyzm-serve
  BASE_IMAGE: debian:stable-slim

jobs:
  prep:
    name: ${{ matrix.channel }} (prep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: release
            tag: latest
          - channel: master
            tag: dev
    steps:
      - uses: actions/checkout@v4

      - name: Resolve ZoneMinder version
        run: |
          codename=$(docker run --rm "$BASE_IMAGE" sh -c '. /etc/os-release && echo "$VERSION_CODENAME"')
          # The newest version that zmrepo has for both architectures. Each arch's nightly is built
          # separately, so for a while the newest one may exist for only one of them.
          eval "$(release/zoneminder/zm-version.sh "${{ matrix.channel }}" "$codename" amd64,arm64)"
          upstream=${ZM_VERSION%%[+~]*}     # 1.38.6+trixie1 -> 1.38.6
          upstream=${upstream%-*}
          minor=${upstream%.*}              # 1.38
          pyzm=$(sed -n 's/^ARG PYZM_VERSION=//p' release/pyzm-serve/Dockerfile)
          if [ "${{ inputs.test_push }}" = true ]; then
            REPOS=$(for r in $REPOS; do printf '%s-test ' "$r"; done)
            PYZM_REPOS=$(for r in $PYZM_REPOS; do printf '%s-test ' "$r"; done)
          fi
          push=false
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            if [ "${{ inputs.test_push }}" = true ]; then push=true; fi
            if [ "${{ github.event_name }}" != pull_request ] && [ "${{ github.ref }}" = refs/heads/master ]; then push=true; fi
          fi
          tags() {  # tags <suffix>: every repo x {channel tag, minor, full version}
            for repo in $REPOS; do
              for t in "${{ matrix.tag }}" "$minor" "$upstream"; do printf '%s ' "$repo:$t$1"; done
            done
          }
          mkdir meta
          {
            echo "channel=$ZM_CHANNEL"
            echo "pin=$ZM_PIN"            # see zm-version.sh
            echo "upstream=$upstream"
            echo "pyzm=$pyzm"
            echo "push=$push"
            echo "zm_repo=${REPOS%% *}"
            echo "pyzm_repo=${PYZM_REPOS%% *}"
            echo "zm_tags=$(tags "")"
            echo "es_tags=$(tags "-es")"
            echo "pyzm_tags=$(for r in $PYZM_REPOS; do printf '%s ' "$r:latest" "$r:$pyzm"; done)"
          } | tee meta/meta.env

      - uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.channel }}
          path: meta/meta.env
          retention-days: 1

  build:
    name: ${{ matrix.channel }} (${{ matrix.arch }})
    needs: prep
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write   # upload scan results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        channel: [release, master]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: meta-${{ matrix.channel }}
          path: meta

      - name: Load metadata
        id: meta
        run: tee -a "$GITHUB_OUTPUT" < meta/meta.env

      - name: Smoke test
        env:
          ZM_CHANNEL: ${{ steps.meta.outputs.channel }}
          ZM_VERSION: ${{ steps.meta.outputs.pin }}
        run: tests/smoke.sh

      # Scan the images the smoke test just built and ran, before any registry login, so the
      # scanner never runs with Docker Hub credentials available. amd64 only: the arm64 images
      # hold the same packages, and scanning both would report every finding twice.
      - name: Scan zm-es
        id: scan_zm
        if: matrix.arch == 'amd64'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: zmsmoke:es
          grype-version: v0.121.0
          only-fixed: true
          fail-build: false
          severity-cutoff: high   # only sets when the step shows a warning
          output-format: sarif
          output-file: scan-zm-es.sarif
      - name: Scan pyzm-serve
        id: scan_pyzm
        if: matrix.arch == 'amd64' && matrix.channel == 'release'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: zmsmoke-pyzm-serve:latest
          grype-version: v0.121.0
          only-fixed: true
          fail-build: false
          severity-cutoff: high   # only sets when the step shows a warning
          output-format: sarif
          output-file: scan-pyzm-serve.sarif
      - name: Scan summary
        if: matrix.arch == 'amd64'
        run: |
          {
            echo "### Fixable vulnerabilities scoring 7.0 or more (${{ matrix.channel }})"
            for f in scan-*.sarif; do
              name=${f#scan-}; echo; echo "**${name%.sarif}**"; echo
              jq -r -f .github/scan-summary.jq "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      # Pull requests from forks get a read-only token, so they only get the summary above.
      - name: Upload zm-es scan
        if: matrix.arch == 'amd64' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scan-zm-es.sarif
          category: grype-zm-es-${{ matrix.channel }}
      - name: Upload pyzm-serve scan
        if: matrix.arch == 'amd64' && matrix.channel == 'release' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scan-pyzm-serve.sarif
          category: grype-pyzm-serve

      - uses: docker/setup-buildx-action@v3
        if: steps.meta.outputs.push == 'true'
      - uses: docker/login-action@v3
        if: steps.meta.outputs.push == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Each image is pushed untagged, by digest. The merge job tags the multi-arch index.
      - name: Push zm
        id: zm
        if: steps.meta.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: release/zoneminder
          target: zm
          platforms: linux/${{ matrix.arch }}
          pull: true
          # The daily run rebuilds every layer so Debian package updates reach the image.
          # The cache would otherwise replay yesterday's apt-get layers.
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            ZM_CHANNEL=${{ steps.meta.outputs.channel }}
            ZM_VERSION=${{ steps.meta.outputs.pin }}
          labels: |
            org.opencontainers.image.title=ZoneMinder
            org.opencontainers.image.description=ZoneMinder video surveillance on Debian
            org.opencontainers.image.version=${{ steps.meta.outputs.upstream }}
            org.opencontainers.image.url=https://zoneminder.com
            org.opencontainers.image.documentation=https://zoneminder.readthedocs.io
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-2.0-or-later
          tags: ${{ steps.meta.outputs.zm_repo }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.channel }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.channel }}-${{ matrix.arch }}

      - name: Push zm-es
        id: es
        if: steps.meta.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: release/zoneminder
          target: zm-es
          platforms: linux/${{ matrix.arch }}
          pull: true
          # Reuse the zm layers the step above just rebuilt; rebuild only the zm-es stage.
          no-cache-filters: ${{ github.event_name == 'schedule' && 'zm-es' || '' }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            ZM_CHANNEL=${{ steps.meta.outputs.channel }}
            ZM_VERSION=${{ steps.meta.outputs.pin }}
          labels: |
            org.opencontainers.image.title=ZoneMinder with event server
            org.opencontainers.image.description=ZoneMinder video surveillance on Debian, with zmeventnotificationNg
            org.opencontainers.image.version=${{ steps.meta.outputs.upstream }}
            org.opencontainers.image.url=https://zoneminder.com
            org.opencontainers.image.documentation=https://zoneminder.readthedocs.io
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-2.0-or-later
          tags: ${{ steps.meta.outputs.zm_repo }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.channel }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.channel }}-${{ matrix.arch }}

      - name: Push pyzm-serve
        id: pyzm
        if: steps.meta.outputs.push == 'true' && matrix.channel == 'release'
        uses: docker/build-push-action@v6
        with:
          context: release/pyzm-serve
          platforms: linux/${{ matrix.arch }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          labels: |
            org.opencontainers.image.title=pyzm-serve
            org.opencontainers.image.description=Object detection server for the ZoneMinder event server
            org.opencontainers.image.version=${{ steps.meta.outputs.pyzm }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.meta.outputs.pyzm_repo }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=pyzm-serve-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pyzm-serve-${{ matrix.arch }}

      - name: Save digests
        if: steps.meta.outputs.push == 'true'
        run: |
          mkdir digests
          echo "${{ steps.zm.outputs.digest }}" > digests/zm
          echo "${{ steps.es.outputs.digest }}" > digests/zm-es
          if [ -n "${{ steps.pyzm.outputs.digest }}" ]; then echo "${{ steps.pyzm.outputs.digest }}" > digests/pyzm; fi
          head digests/*

      - uses: actions/upload-artifact@v4
        if: steps.meta.outputs.push == 'true'
        with:
          name: digests-${{ matrix.channel }}-${{ matrix.arch }}
          path: digests/
          retention-days: 1

  merge:
    name: ${{ matrix.channel }} (merge)
    needs: [prep, build]
    # A failed nightly build mustn't hold back the release tags, so run even when another
    # channel's build failed. A channel missing a digest fails its own merge below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        channel: [release, master]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: meta-${{ matrix.channel }}
          path: meta

      - name: Load metadata
        id: meta
        run: tee -a "$GITHUB_OUTPUT" < meta/meta.env

      - uses: actions/download-artifact@v4
        if: steps.meta.outputs.push == 'true'
        with:
          pattern: digests-${{ matrix.channel }}-*
          path: digests

      - uses: docker/setup-buildx-action@v3
        if: steps.meta.outputs.push == 'true'
      - uses: docker/login-action@v3
        if: steps.meta.outputs.push == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: steps.meta.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.meta.outputs.push == 'true'
        with:
          cosign-release: v3.1.4

      - name: Tag and sign multi-arch images
        if: steps.meta.outputs.push == 'true'
        env:
          CHANNEL: ${{ matrix.channel }}
          ZM_REPO: ${{ steps.meta.outputs.zm_repo }}
          PYZM_REPO: ${{ steps.meta.outputs.pyzm_repo }}
          ZM_TAGS: ${{ steps.meta.outputs.zm_tags }}
          ES_TAGS: ${{ steps.meta.outputs.es_tags }}
          PYZM_TAGS: ${{ steps.meta.outputs.pyzm_tags }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # merge <image> <repo> <tags> <description>: one index from both architectures' digests,
          # under every tag. imagetools copies the images into the other repos and registries.
          # GHCR reads the source annotation on the index to link the package to this repo.
          # Then cosign signs the index in each repo, since signatures are stored per repo.
          merge() {
            local sources=() tags=() arch f
            for arch in amd64 arm64; do
              f="digests/digests-$CHANNEL-$arch/$1"
              [ -s "$f" ] || { echo "::error::no $arch digest for $1 ($CHANNEL)"; return 1; }
              sources+=("$2@$(cat "$f")")
            done
            for t in $3; do tags+=(-t "$t"); done
            docker buildx imagetools create "${tags[@]}" \
              --annotation "index:org.opencontainers.image.source=$SOURCE" \
              --annotation "index:org.opencontainers.image.description=$4" \
              "${sources[@]}"
            docker buildx imagetools inspect "${3%% *}"
            local digest repo
            digest=$(docker buildx imagetools inspect "${3%% *}" --format '{{json .Manifest}}' | jq -r .digest)
            for repo in $(for t in $3; do echo "${t%:*}"; done | sort -u); do
              cosign sign --yes "$repo@$digest"
            done
          }
          merge zm "$ZM_REPO" "$ZM_TAGS" "ZoneMinder video surveillance on Debian"
          merge zm-es "$ZM_REPO" "$ES_TAGS" "ZoneMinder video surveillance on Debian, with zmeventnotificationNg"
          if [ "$CHANNEL" = release ]; then
            merge pyzm "$PYZM_REPO" "$PYZM_TAGS" "Object detection server for the ZoneMinder event server"
          fi
