name: pyzm-serve-cuda

# Builds zoneminder/pyzm-serve:cuda (amd64 only), tests it with tests/pyzm-cuda.sh, and pushes
# it from master, to Docker Hub and to ghcr.io/zoneminder/pyzm-serve. The OpenCV compile takes about 25 minutes the first time. After that the
# GitHub Actions cache holds it, and only a change to the Dockerfile ARGs or a new CUDA base
# image rebuilds it. GitHub drops caches unused for 7 days, so the schedule runs twice a week
# to keep it, and to pick up base image and Ubuntu package updates.
#
# GitHub's runners have no GPU, so this proves OpenCV has CUDA and cuDNN and that detection
# works on the CPU. It can't prove GPU inference works.

on:
  push:
    branches: [master]
    paths: ['release/pyzm-serve/**', 'tests/pyzm-cuda.sh', '.github/workflows/pyzm-cuda.yml']
  pull_request:
    paths: ['release/pyzm-serve/**', 'tests/pyzm-cuda.sh', '.github/workflows/pyzm-cuda.yml']
  schedule:
    - cron: '41 5 * * 1,4'
  workflow_dispatch:
    inputs:
      test_push:
        description: Push to the -test repos (e.g. zoneminder/zoneminder-test) from any branch
        type: boolean
        default: false

env:
  PYZM_REPOS: zoneminder/pyzm-serve ghcr.io/zoneminder/pyzm-serve
  TEST_IMAGE: pyzm-serve:cuda-test

jobs:
  cuda:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/checkout@v4

      # The CUDA devel image alone is over 10 GB unpacked.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Tags
        id: meta
        run: |
          pyzm=$(sed -n 's/^ARG PYZM_VERSION=//p' release/pyzm-serve/Dockerfile.cuda)
          if [ "${{ inputs.test_push }}" = true ]; then
            PYZM_REPOS=$(for r in $PYZM_REPOS; do printf '%s-test ' "$r"; done)
          fi
          push=false
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            if [ "${{ inputs.test_push }}" = true ]; then push=true; fi
            if [ "${{ github.event_name }}" != pull_request ] && [ "${{ github.ref }}" = refs/heads/master ]; then push=true; fi
          fi
          {
            echo "push=$push"
            echo "pyzm=$pyzm"
            echo "tags=$(for r in $PYZM_REPOS; do printf '%s,' "$r:cuda" "$r:$pyzm-cuda"; done)"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: release/pyzm-serve
          file: release/pyzm-serve/Dockerfile.cuda
          platforms: linux/amd64
          pull: true
          load: true
          # Scheduled runs rebuild the runtime stage so Ubuntu package updates reach the image.
          # The OpenCV compile stage stays cached.
          no-cache-filters: ${{ github.event_name == 'schedule' && 'runtime' || '' }}
          build-args: BUILD_JOBS=4
          labels: |
            org.opencontainers.image.title=pyzm-serve (CUDA)
            org.opencontainers.image.description=Object detection server for the ZoneMinder event server, on NVIDIA GPUs
            org.opencontainers.image.version=${{ steps.meta.outputs.pyzm }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha,scope=pyzm-cuda
          cache-to: type=gha,mode=max,scope=pyzm-cuda

      - name: Test
        run: tests/pyzm-cuda.sh "$TEST_IMAGE"

      - uses: docker/login-action@v3
        if: steps.meta.outputs.push == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: steps.meta.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as Build, so every layer comes from the cache and the pushed image is the one
      # just tested. This step adds the SBOM and provenance attestations, which a docker push of
      # the loaded image can't carry.
      - name: Push
        id: push
        if: steps.meta.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: release/pyzm-serve
          file: release/pyzm-serve/Dockerfile.cuda
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          build-args: BUILD_JOBS=4
          labels: |
            org.opencontainers.image.title=pyzm-serve (CUDA)
            org.opencontainers.image.description=Object detection server for the ZoneMinder event server, on NVIDIA GPUs
            org.opencontainers.image.version=${{ steps.meta.outputs.pyzm }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=pyzm-cuda

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.meta.outputs.push == 'true'
        with:
          cosign-release: v3.1.4
      - name: Sign
        if: steps.meta.outputs.push == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for repo in $(echo "$TAGS" | tr , '\n' | sed '/^$/d; s/:[^:]*$//' | sort -u); do
            cosign sign --yes "$repo@$DIGEST"
          done
