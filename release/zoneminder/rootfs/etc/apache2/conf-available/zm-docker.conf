# Container tweaks: log to stdout/stderr, send / to the ZoneMinder UI.
ServerName localhost
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined
RedirectMatch ^/$ /zm/
ServerTokens Prod
ServerSignature Off

# go2rtc (API, WebSocket and its own web page) at /zm/go2rtc/, on the same address as ZoneMinder.
# Browsers then make same-origin requests, which go2rtc's WebSocket origin check accepts, and
# go2rtc's port stays inside the container. Set Options > System > GO2RTC_PATH to
# <ZM_PUBLIC_URL>/zm/go2rtc.
ProxyPreserveHost On
ProxyPass /zm/go2rtc/ http://127.0.0.1:1984/ upgrade=websocket
ProxyPassReverse /zm/go2rtc/ http://127.0.0.1:1984/
