# Container tweaks: log to stdout/stderr, send / to the ZoneMinder UI.
ServerName localhost
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined
RedirectMatch ^/$ /zm/
ServerTokens Prod
ServerSignature Off

# go2rtc at /zm/go2rtc/, on the same address as ZoneMinder. Browsers then make same-origin
# requests, which go2rtc's WebSocket origin check accepts, and go2rtc's port stays inside the
# container. Set Options > System > GO2RTC_PATH to <ZM_PUBLIC_URL>/zm/go2rtc.
ProxyPreserveHost On
ProxyPass /zm/go2rtc/ http://127.0.0.1:1984/ upgrade=websocket
ProxyPassReverse /zm/go2rtc/ http://127.0.0.1:1984/

# go2rtc's API has no authentication, and ZoneMinder's login doesn't cover it. Anyone who could
# reach it could rewrite go2rtc's config or point it at any source. So only processes inside the
# container get the whole API: zmc registers streams through this URL, reaching it over loopback
# via the /etc/hosts entry that init-config writes for ZM_PUBLIC_URL. init-config writes
# zm-go2rtc-allow.conf from GO2RTC_API_ALLOW, for a reverse proxy that zmc's calls come through.
<Location /zm/go2rtc/>
    <RequireAny>
        Require ip 127.0.0.1 ::1
        Include /etc/apache2/zm-go2rtc-allow.conf
    </RequireAny>
</Location>
# Browsers get the live view WebSocket, only for ZoneMinder's stream names (monitor ID plus an
# optional channel suffix), and the HLS fallback that a WebSocket session hands out.
<LocationMatch "^/zm/go2rtc/api/ws$">
    <RequireAny>
        Require ip 127.0.0.1 ::1
        Include /etc/apache2/zm-go2rtc-allow.conf
        Require expr "%{QUERY_STRING} =~ /^src=[0-9]+(_(CameraDirectPrimary|CameraDirectSecondary|ZoneMinderPrimary))?$/"
    </RequireAny>
</LocationMatch>
<LocationMatch "^/zm/go2rtc/api/hls/">
    Require all granted
</LocationMatch>
